name: Create draft PR

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-draft-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Create or refresh draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: develop
        run: python3 .github/scripts/auto_pr.py
