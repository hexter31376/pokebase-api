name: Create draft PR

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-draft-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create draft PR if absent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: develop
        run: python3 .github/scripts/auto_pr.py
